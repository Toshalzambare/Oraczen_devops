name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t notes-api:${{ github.sha }} -f app/Dockerfile app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: notes-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        run: |
          # Convert username to lowercase to ensure valid docker image name
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag notes-api:${{ github.sha }} ghcr.io/$REPO_OWNER/notes-api:${{ github.sha }}
          docker push ghcr.io/$REPO_OWNER/notes-api:${{ github.sha }}

  config-scan:
    name: IaC / Config Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm dependency build
        run: helm dependency build helm/notes-api

      - name: Helm lint
        run: helm lint helm/notes-api

      - name: Render manifests
        run: helm template notes-ci helm/notes-api > /tmp/rendered.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: /tmp/rendered.yaml
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  update-gitops:
    name: CD / Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [build-and-scan, config-scan]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tag
        run: |
          # Dynamically update the image tag in the Dev environment
          sed -i -E 's/tag: .*/tag: "${{ github.sha }}"/g' helm/notes-api/env/dev/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/notes-api/env/dev/values.yaml
          
          # Only commit and push if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: deploy ${{ github.sha }} to dev [skip ci]"
            git push
          fi
