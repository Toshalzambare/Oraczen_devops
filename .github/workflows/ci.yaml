name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t notes-api:${{ github.sha }} -f app/Dockerfile app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: notes-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  config-scan:
    name: IaC / Config Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm dependency build
        run: helm dependency build helm/notes-api

      - name: Helm lint
        run: helm lint helm/notes-api

      - name: Render manifests
        run: helm template notes-ci helm/notes-api > /tmp/rendered.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: /tmp/rendered.yaml
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
