apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notes-api.fullname" . }}
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notes-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notes-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Simple monitoring hook: signals Prometheus to scrape this pod.
        # NOTE: This requires the app to expose /metrics (e.g. via prometheus-fastapi-instrumentator).
        # A proper ServiceMonitor (via Prometheus Operator) is the recommended production approach.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "notes-api.fullname" . }}
      containers:
        - name: notes-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "notes-api.fullname" . }}-config
          env:
            # POSTGRES_PASSWORD is sourced exclusively from the Secret auto-generated
            # by the bitnami/postgresql subchart. We never store the password in
            # values.yaml or any other plain-text file.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notes-api.postgresSecretName" . }}
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
