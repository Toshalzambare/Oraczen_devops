apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Toshalzambare/Oraczen_devops.git
    targetRevision: main
    path: helm/notes-api
    helm:
      valueFiles:
        - values.yaml
        - env/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-dev
  syncPolicy:
    # Dev uses automated sync with self-heal and prune.
    # Lower risk environment — fast feedback loop is more valuable than caution.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
